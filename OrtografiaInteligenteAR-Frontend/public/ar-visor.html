
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>Visor AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #071b36;
    }

    #mensaje {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      z-index: 20;
      background: rgba(0, 31, 70, 0.85);
      color: white;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div id="mensaje">
    Apunta la cámara hacia la tarjeta.
  </div>

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
    renderer="logarithmicDepthBuffer: true;"
  >

    <a-marker id="marcador" type="pattern">

      <a-box
        position="0 0.5 0"
        material="color: #2563eb;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"
      ></a-box>

      <a-text
        value="Ortografia AR"
        position="-0.7 1.3 0"
        color="#ffffff"
        scale="0.6 0.6 0.6"
      ></a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

  <script>
    const params = new URLSearchParams(window.location.search);
    const archivo = params.get("archivo") || "";

    if (/^\/assets\/ar\/[a-zA-Z0-9_-]+\.patt$/.test(archivo)) {
      document.getElementById("marcador")
        .setAttribute("url", archivo);
    } else {
      document.getElementById("mensaje").textContent =
        "Archivo de marcador inválido";
    }
  </script>

</body>
</html>
